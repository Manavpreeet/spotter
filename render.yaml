services:
  - type: web
    name: spotter-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: spotter-api.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://spotter-hos.vercel.app,http://localhost:5173
